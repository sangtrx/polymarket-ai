name: ci-web

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  web-baseline:
    runs-on: ubuntu-latest
    services:
      operator-bff-postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: operator_bff_test
          POSTGRES_USER: operator_bff
          POSTGRES_PASSWORD: operator_bff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U operator_bff -d operator_bff_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt,clippy

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run preflight and bootstrap checks
        run: |
          set -euo pipefail
          mkdir -p bootstrap-evidence
          npm run preflight 2>&1 | tee bootstrap-evidence/preflight.log
          node tools/bootstrap/check-bootstrap.mjs --evidence-file bootstrap-evidence/bootstrap-check.json 2>&1 | tee bootstrap-evidence/bootstrap-check.log

      - name: Run operator console quality gates
        run: |
          set -euo pipefail
          npm run web:lint 2>&1 | tee bootstrap-evidence/web-lint.log
          npm run web:typecheck 2>&1 | tee bootstrap-evidence/web-typecheck.log
          npm run web:build 2>&1 | tee bootstrap-evidence/web-build.log

      - name: Run operator BFF quality gates
        env:
          OPERATOR_BFF_TEST_DATABASE_URL: postgresql://operator_bff:operator_bff_test@127.0.0.1:5432/operator_bff_test
        run: |
          set -euo pipefail
          pnpm --filter operator-bff typecheck 2>&1 | tee bootstrap-evidence/operator-bff-typecheck.log
          pnpm --filter operator-bff test 2>&1 | tee bootstrap-evidence/operator-bff-test.log
          pnpm --filter operator-bff test:postgres 2>&1 | tee bootstrap-evidence/operator-bff-postgres-integration.log
          pnpm --filter operator-bff build 2>&1 | tee bootstrap-evidence/operator-bff-build.log

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-evidence
          path: bootstrap-evidence
