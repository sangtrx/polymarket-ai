name: san279-lockfile-artifact

on:
  push:
    branches:
      - "tqsang97/san-279-track-a-polymarket-typescript-operator-workflow-bff-proof"

permissions:
  contents: write

jobs:
  reconcile-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: "tqsang97/san-279-track-a-polymarket-typescript-operator-workflow-bff-proof"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Reconcile frozen lockfile and remove temporary workflow
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          rm .github/workflows/san279-lockfile-artifact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/san279-lockfile-artifact.yml
          git diff --cached --check
          git commit -m "fix: reconcile operator-bff workspace lockfile"
          git push origin HEAD:tqsang97/san-279-track-a-polymarket-typescript-operator-workflow-bff-proof
